<!doctype html>
<html lang="ja">
  <meta charset="utf-8">
  <title>Weapn UI Worker</title>
  <style>
  body {
    font-family: sans-serif;
    margin: 3rem;
  }
  button {
    padding: .7rem;
    margin: .3rem;
  }
  </style>
  <h1>サーバーなしの Weapn</h1>
  <p>資産とアプリの処理は main.ts、ウィンドウは UI Worker が担当します。</p>
  <button data-action="maximize">最大化</button>
  <button data-action="restore">元に戻す</button>
  <button data-action="title">タイトル変更</button>
  <button data-action="close">閉じる</button>
  <script>
  document.querySelectorAll("button").forEach((button) => {
    button.onclick = () =>
      chrome.webview.postMessage({ type: button.dataset.action });
  });
  </script>
</html>
