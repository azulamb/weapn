<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Transparent canvas</title>
    <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }
    canvas {
      display: block;
      width: 320px;
      height: 320px;
    }
    </style>
  </head>
  <body>
    <canvas title="ダブルクリックまたは Esc で終了"
      aria-label="PNG 画像"></canvas>
    <script type="module" src="./app.js"></script>
  </body>
</html>
