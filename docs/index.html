<!DOCTYPE html>
<html lang="ja" style="font-size: 3vmin">
  <head>
    <meta charset="utf-8">
    <title>Weapn</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <style>
      html {
        height: 100%;
        background: #73859b;
        color: #d0d0d0;
      }
      body {
        min-height: 100%;
        margin: 0;
        display: grid;
        grid-template-rows: auto 2rem;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      #logo {
        width:20vmin;
        display: block;
        margin: 0.5rem;
      }
      h1 {
        margin: 0.5rem;
        color: #fff;
        font-weight: normal;
        font-family: monospace;
        letter-spacing: 0.2rem;
      }
      H1::before, h1::after {
        content: '-';
        opacity: 0.5;
      }
      a {
        color: #d4e8ff;
        text-decoration: none;
      }
      footer {
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="favicon.svg" alt="Weapn Logo" id="logo">
      <h1>Weapn</h1>
    </main>
    <footer>
      <small>
        GitHub:
        <a href="https://github.com/azulamb/weapn">azulamb/weapn</a>
      </small>
    </footer>
  </body>
</html>
